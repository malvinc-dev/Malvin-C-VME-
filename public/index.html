<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malvin C VME — Pair Your Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #6e00ff;
            --bg: #0b0e14;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0b0e14 100%);
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            text-align: center;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.1);
        }

        button {
            width: 100%;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            padding: 1rem;
            color: #fff;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #code-display {
            margin-top: 2rem;
            padding: 1.5rem;
            background: rgba(0, 255, 136, 0.1);
            border: 1px dashed var(--primary);
            border-radius: 12px;
            display: none;
        }

        .code-title {
            font-size: 0.7rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .code-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            letter-spacing: 4px;
            color: #fff;
        }

        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="stars-container" id="stars"></div>
    
    <div class="container">
        <div class="card">
            <h1>MALVIN C VME</h1>
            <p>Connect your WhatsApp account securely</p>
            
            <div class="input-group">
                <label for="number">Phone Number</label>
                <input type="text" id="number" placeholder="263776676755" value="">
            </div>
            
            <button id="pair-btn">Get Pairing Code</button>
            <div class="loader" id="loader"></div>

            <div id="code-display">
                <div class="code-title">YOUR PAIRING CODE</div>
                <div class="code-value" id="pairing-code">------</div>
                <p style="margin-top: 1rem; margin-bottom: 0; font-size: 0.7rem;">Enter this code in Linked Devices</p>
            </div>
        </div>
        
        <div class="footer">
            HANDSOME TECH ZIMBABWE 🇿🇼
        </div>
    </div>

    <script>
        // Generate stars
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${2 + Math.random() * 3}s`);
            starsContainer.appendChild(star);
        }

        const pairBtn = document.getElementById('pair-btn');
        const loader = document.getElementById('loader');
        const codeDisplay = document.getElementById('code-display');
        const codeValue = document.getElementById('pairing-code');
        const numberInput = document.getElementById('number');

        pairBtn.addEventListener('click', async () => {
            const number = numberInput.value.trim();
            if (!number) return alert('Please enter your number!');

            pairBtn.style.display = 'none';
            loader.style.display = 'block';
            codeDisplay.style.display = 'none';

            try {
                const response = await fetch('/api/pair', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ number })
                });
                
                const data = await response.json();
                if (data.code) {
                    codeValue.textContent = data.code;
                    codeDisplay.style.display = 'block';
                } else {
                    alert('Error: ' + (data.error || 'Failed to get code'));
                    pairBtn.style.display = 'block';
                }
            } catch (err) {
                alert('Connection error!');
                pairBtn.style.display = 'block';
            } finally {
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
